services:
  # HTTPS, MiniApp и проксирование API на домене из DOMAIN
  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    environment:
      DOMAIN: ${DOMAIN:?укажите DOMAIN в .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - server
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    env_file: .env
    environment:
      DEV_AUTH_BYPASS: "false"
    expose:
      - "8080"
    restart: unless-stopped

  bot:
    build:
      context: .
      dockerfile: apps/bot/Dockerfile
    env_file: .env
    restart: unless-stopped
    profiles: ["bot"]

  # База и кэш понадобятся с этапа 2 (позиции, балансы, рейтинги)
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: financio
      POSTGRES_PASSWORD: financio
      POSTGRES_DB: financio
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    profiles: ["db"]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    profiles: ["db"]

volumes:
  caddy_data:
  caddy_config:
  pgdata:
