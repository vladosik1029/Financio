services:
  # HTTPS, MiniApp и проксирование API на домене из DOMAIN
  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    environment:
      DOMAIN: ${DOMAIN:?укажите DOMAIN в .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - server
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    env_file: .env
    environment:
      DEV_AUTH_BYPASS: "false"
    expose:
      - "8080"
    volumes:
      # Встроенная база PGlite (если DATABASE_URL не указывает на PostgreSQL)
      - server_data:/app/apps/server/data
    restart: unless-stopped

  bot:
    build:
      context: .
      dockerfile: apps/bot/Dockerfile
    env_file: .env
    restart: unless-stopped
    profiles: ["bot"]

  # Отдельный PostgreSQL: нужен, когда встроенной базы станет мало.
  # Запуск: docker compose --profile db up -d, затем DATABASE_URL=postgres://financio:financio@postgres:5432/financio
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: financio
      POSTGRES_PASSWORD: financio
      POSTGRES_DB: financio
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    profiles: ["db"]


volumes:
  caddy_data:
  caddy_config:
  server_data:
  pgdata:
